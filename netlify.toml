[build]
  command = "python build.py"
  publish = "public"

[build.environment]
  PYTHON_VERSION = "3.12"

# Only the production branch (main) is published at democracytoday.news.
# Draft branches are built as private branch deploys / deploy previews.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "https://www.democracytoday.news/*"
  to = "https://democracytoday.news/:splat"
  status = 301
  force = true
